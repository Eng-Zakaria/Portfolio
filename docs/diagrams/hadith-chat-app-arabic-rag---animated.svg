<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Inter', -apple-system, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #f8fafc; }
    .label { font-size: 12px; fill: #94a3b8; font-weight: 500; }
    .component { font-size: 14px; fill: #f8fafc; font-weight: 600; }
    .metric { font-size: 11px; fill: #64748b; }
    .arabic { font-size: 16px; fill: #fbbf24; font-weight: 600; }

    @keyframes flow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .flow-line { stroke-dasharray: 10 5; animation: flow 1s linear infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .blinking { animation: blink 1.5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="960" height="700" fill="url(#bg-gradient)"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" class="title">Hadith Chat App — Arabic RAG Architecture</text>
  <text x="480" y="65" text-anchor="middle" class="metric">Graduation Project • A+ Grade • 70% Accuracy</text>

  <!-- Input: User Query -->
  <rect x="30" y="120" width="160" height="80" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2" filter="url(#glow)"/>
  <text x="110" y="150" text-anchor="middle" font-size="28">💬</text>
  <text x="110" y="175" text-anchor="middle" class="component">User Query</text>
  <text x="110" y="190" text-anchor="middle" class="metric">Arabic/English</text>

  <!-- Django Backend -->
  <rect x="250" y="120" width="140" height="80" rx="12" fill="#1e293b" stroke="#059669" stroke-width="2"/>
  <text x="320" y="150" text-anchor="middle" font-size="28">🌐</text>
  <text x="320" y="175" text-anchor="middle" class="component">Django</text>
  <text x="320" y="190" text-anchor="middle" class="metric">Backend API</text>

  <!-- RAG Orchestrator -->
  <rect x="450" y="120" width="140" height="80" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="2" filter="url(#glow)"/>
  <text x="520" y="150" text-anchor="middle" font-size="28">⚙️</text>
  <text x="520" y="175" text-anchor="middle" class="component">RAG Core</text>
  <text x="520" y="190" text-anchor="middle" class="metric">Orchestrator</text>

  <!-- Embedding Model -->
  <rect x="650" y="120" width="140" height="80" rx="12" fill="#1e293b" stroke="#ea580c" stroke-width="2"/>
  <text x="720" y="150" text-anchor="middle" font-size="28">🧠</text>
  <text x="720" y="175" text-anchor="middle" class="component">AraBERT</text>
  <text x="720" y="190" text-anchor="middle" class="metric">Arabic Embeddings</text>

  <!-- Query Flow Arrows -->
  <line x1="190" y1="160" x2="250" y2="160" stroke="#2563eb" stroke-width="2" class="flow-line"/>
  <line x1="390" y1="160" x2="450" y2="160" stroke="#059669" stroke-width="2" class="flow-line"/>
  <line x1="590" y1="160" x2="650" y2="160" stroke="#7c3aed" stroke-width="2" class="flow-line"/>

  <!-- Vector Store: Qdrant -->
  <rect x="450" y="280" width="140" height="80" rx="12" fill="#1e293b" stroke="#dc2626" stroke-width="2" filter="url(#glow)"/>
  <text x="520" y="310" text-anchor="middle" font-size="28">📚</text>
  <text x="520" y="335" text-anchor="middle" class="component">Qdrant</text>
  <text x="520" y="355" text-anchor="middle" class="metric">Vector Database</text>

  <!-- Hadith Corpus -->
  <rect x="250" y="280" width="160" height="80" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="310" text-anchor="middle" font-size="28">📖</text>
  <text x="330" y="335" text-anchor="middle" class="component">Hadith Corpus</text>
  <text x="330" y="355" text-anchor="middle" class="metric">50,000+ Hadiths</text>

  <!-- Embedding Generation -->
  <rect x="650" y="280" width="140" height="80" rx="12" fill="#1e293b" stroke="#059669" stroke-width="2"/>
  <text x="720" y="310" text-anchor="middle" font-size="28">⚡</text>
  <text x="720" y="335" text-anchor="middle" class="component">Embed</text>
  <text x="720" y="355" text-anchor="middle" class="metric">Vector Generation</text>

  <!-- Processing Flow -->
  <line x1="330" y1="360" x2="450" y2="320" stroke="#f59e0b" stroke-width="2" class="flow-line"/>
  <line x1="520" y1="200" x2="520" y2="280" stroke="#7c3aed" stroke-width="2" class="flow-line"/>
  <line x1="720" y1="200" x2="720" y2="280" stroke="#059669" stroke-width="2" class="flow-line"/>

  <!-- Retrieval & Ranking -->
  <rect x="250" y="440" width="140" height="80" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="470" text-anchor="middle" font-size="28">🔍</text>
  <text x="320" y="495" text-anchor="middle" class="component">Retrieve</text>
  <text x="320" y="515" text-anchor="middle" class="metric">Semantic Search</text>

  <!-- Context Assembly -->
  <rect x="450" y="440" width="140" height="80" rx="12" fill="#1e293b" stroke="#059669" stroke-width="2"/>
  <text x="520" y="470" text-anchor="middle" font-size="28">📋</text>
  <text x="520" y="495" text-anchor="middle" class="component">Context</text>
  <text x="520" y="515" text-anchor="middle" class="metric">Prompt Assembly</text>

  <!-- LLM Generation -->
  <rect x="650" y="440" width="140" height="80" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="2" filter="url(#glow)"/>
  <text x="720" y="470" text-anchor="middle" font-size="28">🤖</text>
  <text x="720" y="495" text-anchor="middle" class="component">Generate</text>
  <text x="720" y="515" text-anchor="middle" class="metric">LLM Response</text>

  <!-- Retrieval Flow -->
  <line x1="520" y1="360" x2="320" y2="440" stroke="#2563eb" stroke-width="2" class="flow-line"/>
  <line x1="390" y1="480" x2="450" y2="480" stroke="#059669" stroke-width="2" class="flow-line"/>
  <line x1="590" y1="480" x2="650" y2="480" stroke="#7c3aed" stroke-width="2" class="flow-line"/>

  <!-- Output: Response -->
  <rect x="400" y="580" width="200" height="80" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="610" text-anchor="middle" font-size="28">✅</text>
  <text x="500" y="635" text-anchor="middle" class="component">Answer</text>
  <text x="500" y="650" text-anchor="middle" class="metric">With Citation</text>

  <!-- LLM to Output -->
  <line x1="720" y1="520" x2="500" y2="580" stroke="#4ade80" stroke-width="2" class="flow-line"/>

  <!-- Animated Flow Dots -->
  <circle cx="150" cy="160" r="4" fill="#2563eb" class="blinking">
    <animate attributeName="cx" from="150" to="250" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="160" r="4" fill="#059669" class="blinking">
    <animate attributeName="cx" from="420" to="450" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="240" r="4" fill="#7c3aed" class="blinking">
    <animate attributeName="cy" from="240" to="280" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="440" r="4" fill="#2563eb" class="blinking">
    <animate attributeName="cy" from="440" to="480" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="520" r="4" fill="#4ade80" class="blinking">
    <animate attributeName="cy" from="520" to="580" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Performance Metrics -->
  <rect x="70" y="580" width="280" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="210" y="605" text-anchor="middle" class="component">SYSTEM PERFORMANCE</text>
  <text x="90" y="630" class="metric">• 50k+ Hadiths Indexed</text>
  <text x="90" y="650" class="metric">• 70% Chatbot Accuracy</text>

  <rect x="680" y="580" width="250" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="805" y="605" text-anchor="middle" class="component">TECHNICAL DETAILS</text>
  <text x="700" y="630" class="metric">• Multi-language Support</text>
  <text x="700" y="650" class="metric">• Django REST API</text>
</svg>
