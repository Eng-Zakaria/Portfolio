<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    text { font-family: 'Inter', -apple-system, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .label { font-size: 11px; fill: #475569; font-weight: 500; }
    .layer-label { font-size: 10px; font-weight: 600; fill: #2563eb; text-transform: uppercase; letter-spacing: 0.08em; }
  </style>

  <rect width="960" height="850" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" class="title">Credit Risk Analysis — MLOps Platform</text>
  <text x="480" y="55" text-anchor="middle" class="subtitle">End-to-End ML Pipeline with 0.88 AUC-ROC • Hybrid Ensemble Approach</text>

  <!-- Data Layer -->
  <rect x="30" y="80" width="900" height="100" rx="12" fill="#fef3c7" fill-opacity="0.5" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="50" y="100" class="layer-label">Data Layer</text>

  <!-- BigQuery -->
  <rect x="50" y="115" width="140" height="55" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="145" text-anchor="middle" font-size="24">☁️</text>
  <text x="120" y="165" text-anchor="middle" class="label">BigQuery</text>

  <!-- Synthetic Data -->
  <rect x="230" y="115" width="140" height="55" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="145" text-anchor="middle" font-size="24">🔬</text>
  <text x="300" y="165" text-anchor="middle" class="label">Synthetic Data</text>

  <!-- SQL Marts -->
  <rect x="410" y="115" width="140" height="55" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="145" text-anchor="middle" font-size="24">📊</text>
  <text x="480" y="165" text-anchor="middle" class="label">SQL Marts</text>

  <!-- Feature Store -->
  <rect x="590" y="115" width="140" height="55" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="145" text-anchor="middle" font-size="24">⚡</text>
  <text x="660" y="165" text-anchor="middle" class="label">Feature Store</text>

  <!-- Redis -->
  <rect x="770" y="115" width="140" height="55" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="145" text-anchor="middle" font-size="24">🗄️</text>
  <text x="840" y="165" text-anchor="middle" class="label">Redis Lookups</text>

  <!-- Training Layer -->
  <rect x="30" y="200" width="900" height="200" rx="12" fill="#e0f2fe" fill-opacity="0.5" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="50" y="220" class="layer-label">Model Training Layer</text>

  <!-- XGBoost -->
  <rect x="60" y="250" width="140" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="275" text-anchor="middle" font-size="24">🤖</text>
  <text x="130" y="295" text-anchor="middle" class="label">XGBoost</text>

  <!-- LightGBM -->
  <rect x="250" y="250" width="140" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="275" text-anchor="middle" font-size="24">🌿</text>
  <text x="320" y="295" text-anchor="middle" class="label">LightGBM</text>

  <!-- CatBoost -->
  <rect x="440" y="250" width="140" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="275" text-anchor="middle" font-size="24">🐱</text>
  <text x="510" y="295" text-anchor="middle" class="label">CatBoost</text>

  <!-- Hybrid Ensemble -->
  <rect x="630" y="250" width="140" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="275" text-anchor="middle" font-size="24">🎯</text>
  <text x="700" y="295" text-anchor="middle" class="label" font-weight="600">Hybrid Ensemble</text>

  <!-- PyTorch -->
  <rect x="820" y="250" width="100" height="60" rx="8" fill="#ffffff" stroke="#ee4c2c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="870" y="275" text-anchor="middle" font-size="24">🔥</text>
  <text x="870" y="295" text-anchor="middle" class="label">PyTorch</text>

  <!-- Arrows -->
  <path d="M 200 310 L 280 310" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 390 310 L 440 310" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 580 310 L 630 310" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- MLflow -->
  <rect x="250" y="330" width="400" height="40" rx="8" fill="#f0f9ff" stroke="#017cfa" stroke-width="1.5"/>
  <text x="450" y="355" text-anchor="middle" class="label" font-weight="600">MLflow (Tracking &amp; Registry) → Model Registry</text>

  <!-- Serving Layer -->
  <rect x="30" y="400" width="900" height="120" rx="12" fill="#f0fdf4" fill-opacity="0.5" stroke="#86efac" stroke-width="1.5"/>
  <text x="50" y="420" class="layer-label">Serving Layer</text>

  <!-- FastAPI -->
  <rect x="80" y="445" width="160" height="60" rx="8" fill="#ffffff" stroke="#009688" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="470" text-anchor="middle" font-size="24">🚀</text>
  <text x="160" y="490" text-anchor="middle" class="label">FastAPI Endpoint</text>

  <!-- Model Registry -->
  <rect x="300" y="445" width="160" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="470" text-anchor="middle" font-size="24">📦</text>
  <text x="380" y="490" text-anchor="middle" class="label">MLflow Registry</text>

  <!-- Production -->
  <rect x="520" y="445" width="160" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="470" text-anchor="middle" font-size="24">✅</text>
  <text x="600" y="490" text-anchor="middle" class="label">Production</text>

  <!-- Monitoring -->
  <rect x="740" y="445" width="160" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="470" text-anchor="middle" font-size="24">📊</text>
  <text x="820" y="490" text-anchor="middle" class="label">Model Monitoring</text>

  <!-- Orchestration -->
  <rect x="30" y="540" width="900" height="100" rx="12" fill="#fff7ed" fill-opacity="0.5" stroke="#fdba74" stroke-width="1.5"/>
  <text x="50" y="560" class="layer-label">Orchestration &amp; CI/CD</text>

  <!-- Airflow -->
  <rect x="100" y="575" width="160" height="55" rx="8" fill="#ffffff" stroke="#017cfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="600" text-anchor="middle" font-size="24">🔄</text>
  <text x="180" y="620" text-anchor="middle" class="label">Airflow DAGs</text>

  <!-- Docker -->
  <rect x="350" y="575" width="160" height="55" rx="8" fill="#ffffff" stroke="#2496ed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="600" text-anchor="middle" font-size="24">🐳</text>
  <text x="430" y="620" text-anchor="middle" class="label">Docker Containers</text>

  <!-- GitHub Actions -->
  <rect x="600" y="575" width="160" height="55" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="600" text-anchor="middle" font-size="24">⚡</text>
  <text x="680" y="620" text-anchor="middle" class="label">GitHub Actions</text>

  <!-- Model Cards -->
  <rect x="850" y="575" width="80" height="55" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="890" y="600" text-anchor="middle" font-size="24">📝</text>
  <text x="890" y="620" text-anchor="middle" class="label">Model Cards</text>

  <!-- Metrics -->
  <rect x="200" y="670" width="560" height="100" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="700" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">MODEL PERFORMANCE</text>
  <text x="280" y="730" font-size="12" fill="#475569">AUC-ROC: 0.88 (Hybrid Ensemble)</text>
  <text x="280" y="750" font-size="12" fill="#475569">Precision: 85% | Recall: 82%</text>
  <text x="520" y="730" font-size="12" fill="#475569">F1 Score: 83.5%</text>
  <text x="520" y="750" font-size="12" fill="#475569">Latency: &lt;100ms inference</text>
</svg>
