<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Inter', -apple-system, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .label { font-size: 11px; fill: #475569; font-weight: 500; }
    .layer-label { font-size: 10px; font-weight: 600; fill: #2563eb; text-transform: uppercase; letter-spacing: 0.08em; }
    .highlight { color: #ea580c; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="960" height="900" fill="url(#bg-gradient)"/>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" class="title">Waffarha Partner Price Integrity</text>
  <text x="480" y="55" text-anchor="middle" class="subtitle">Automated Price Violation Detection Pipeline</text>

  <!-- Layer 1: Data Sources -->
  <rect x="30" y="80" width="900" height="120" rx="12" fill="#fef3c7" fill-opacity="0.5" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="50" y="100" class="layer-label">Data Sources</text>

  <!-- Partner Data -->
  <rect x="50" y="115" width="150" height="65" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="145" text-anchor="middle" font-size="26">🏪</text>
  <text x="125" y="170" text-anchor="middle" class="label">Partner Database</text>

  <!-- Scraped Data -->
  <rect x="250" y="115" width="150" height="65" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="145" text-anchor="middle" font-size="26">🕷️</text>
  <text x="325" y="170" text-anchor="middle" class="label">Web Scraped Data</text>

  <!-- ClickHouse -->
  <rect x="450" y="115" width="150" height="65" rx="8" fill="#ffffff" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="145" text-anchor="middle" font-size="26">🗄️</text>
  <text x="525" y="170" text-anchor="middle" class="label">ClickHouse</text>

  <!-- Reports -->
  <rect x="650" y="115" width="150" height="65" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="725" y="145" text-anchor="middle" font-size="26">📄</text>
  <text x="725" y="170" text-anchor="middle" class="label">HTML/Excel Reports</text>

  <!-- Layer 2: Ingestion -->
  <rect x="30" y="220" width="900" height="100" rx="12" fill="#e0f2fe" fill-opacity="0.5" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="50" y="240" class="layer-label">Data Ingestion</text>

  <!-- Airflow DAG -->
  <rect x="100" y="250" width="140" height="50" rx="8" fill="#ffffff" stroke="#017cfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="275" text-anchor="middle" font-size="24">🔄</text>
  <text x="170" y="295" text-anchor="middle" class="label">Airflow DAG</text>

  <!-- BeautifulSoup -->
  <rect x="300" y="250" width="140" height="50" rx="8" fill="#ffffff" stroke="#3776ab" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="275" text-anchor="middle" font-size="24">📦</text>
  <text x="370" y="295" text-anchor="middle" class="label">BeautifulSoup</text>

  <!-- Playwright -->
  <rect x="500" y="250" width="140" height="50" rx="8" fill="#ffffff" stroke="#ff6b35" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="275" text-anchor="middle" font-size="24">🎭</text>
  <text x="570" y="295" text-anchor="middle" class="label">Playwright</text>

  <!-- Scraper Registry -->
  <rect x="700" y="250" width="140" height="50" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="275" text-anchor="middle" font-size="24">📋</text>
  <text x="770" y="295" text-anchor="middle" class="label">Scraper Registry</text>

  <!-- Layer 3: Matching Engine -->
  <rect x="30" y="340" width="900" height="250" rx="12" fill="#f0fdf4" fill-opacity="0.5" stroke="#86efac" stroke-width="1.5"/>
  <text x="50" y="360" class="layer-label">Tiered Matching Engine</text>

  <!-- Tier 1: Exact Match -->
  <rect x="60" y="380" width="180" height="80" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="150" y="405" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">TIER 1</text>
  <text x="150" y="430" text-anchor="middle" font-size="20">✅</text>
  <text x="150" y="450" text-anchor="middle" class="label" font-weight="600">Exact Code Match</text>
  <text x="150" y="465" text-anchor="middle" font-size="9" fill="#6b7280">100% Match</text>

  <!-- Tier 2: Override -->
  <rect x="280" y="380" width="180" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="405" text-anchor="middle" font-size="10" font-weight="600" fill="#f59e0b">TIER 2</text>
  <text x="370" y="430" text-anchor="middle" font-size="20">⚠️</text>
  <text x="370" y="450" text-anchor="middle" class="label" font-weight="600">Price Override</text>
  <text x="370" y="465" text-anchor="middle" font-size="9" fill="#6b7280">Manual Override Check</text>

  <!-- Tier 3: Fuzzy Match -->
  <rect x="500" y="380" width="180" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="405" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">TIER 3</text>
  <text x="590" y="430" text-anchor="middle" font-size="20">🔍</text>
  <text x="590" y="450" text-anchor="middle" class="label" font-weight="600">Fuzzy Match</text>
  <text x="590" y="465" text-anchor="middle" font-size="9" fill="#6b7280">rapidfuzz 85%+</text>

  <!-- No Match -->
  <rect x="720" y="380" width="180" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="810" y="405" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">TIER 4</text>
  <text x="810" y="430" text-anchor="middle" font-size="20">❌</text>
  <text x="810" y="450" text-anchor="middle" class="label" font-weight="600">No Match</text>
  <text x="810" y="465" text-anchor="middle" font-size="9" fill="#6b7280">Manual Review</text>

  <!-- Matching Flow -->
  <path d="M 240 420 L 280 420" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="260" y="415" text-anchor="middle" font-size="8" fill="#6b7280">fallback</text>
  <path d="M 460 420 L 500 420" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="480" y="415" text-anchor="middle" font-size="8" fill="#6b7280">fallback</text>
  <path d="M 680 420 L 720 420" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="700" y="415" text-anchor="middle" font-size="8" fill="#6b7280">fallback</text>

  <!-- Violation Detection -->
  <rect x="250" y="490" width="460" height="80" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="515" text-anchor="middle" font-size="22">⚠️</text>
  <text x="480" y="540" text-anchor="middle" class="label" font-weight="600" fill="#dc2626">Price Violation Detected</text>

  <!-- Arrows to violations -->
  <path d="M 150 460 L 150 500 L 250 530" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="140" y="500" text-anchor="end" font-size="9" fill="#059669">match</text>
  <path d="M 370 460 L 370 500 L 400 530" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="380" y="500" text-anchor="end" font-size="9" fill="#f59e0b">override</text>
  <path d="M 590 460 L 590 500 L 550 530" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="600" y="500" text-anchor="start" font-size="9" fill="#dc2626">violation</text>

  <!-- Layer 4: Storage -->
  <rect x="30" y="440" width="900" height="100" rx="12" fill="#faf5ff" fill-opacity="0.5" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="50" y="460" class="layer-label">Storage &amp; Reporting</text>

  <!-- ClickHouse Store -->
  <rect x="80" y="470" width="150" height="55" rx="8" fill="#ffffff" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="495" text-anchor="middle" font-size="22">🗄️</text>
  <text x="155" y="515" text-anchor="middle" class="label">ClickHouse Store</text>

  <!-- HTML Report -->
  <rect x="280" y="470" width="150" height="55" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="495" text-anchor="middle" font-size="22">📄</text>
  <text x="355" y="515" text-anchor="middle" class="label">HTML Report</text>

  <!-- Excel Report -->
  <rect x="480" y="470" width="150" height="55" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="555" y="495" text-anchor="middle" font-size="22">📊</text>
  <text x="555" y="515" text-anchor="middle" class="label">Excel Report</text>

  <!-- Markdown -->
  <rect x="680" y="470" width="150" height="55" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="755" y="495" text-anchor="middle" font-size="22">📝</text>
  <text x="755" y="515" text-anchor="middle" class="label">Markdown Docs</text>

  <!-- Layer 5: Output -->
  <rect x="30" y="560" width="900" height="120" rx="12" fill="#fff7ed" fill-opacity="0.5" stroke="#fdba74" stroke-width="1.5"/>
  <text x="50" y="580" class="layer-label">Alert &amp; Notification</text>

  <!-- Email -->
  <rect x="60" y="600" width="140" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="625" text-anchor="middle" font-size="24">📧</text>
  <text x="130" y="645" text-anchor="middle" class="label">Email Alert</text>

  <!-- Slack -->
  <rect x="240" y="600" width="140" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="625" text-anchor="middle" font-size="24">💬</text>
  <text x="310" y="645" text-anchor="middle" class="label">Slack Notification</text>

  <!-- Dashboard -->
  <rect x="420" y="600" width="140" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="625" text-anchor="middle" font-size="24">📊</text>
  <text x="490" y="645" text-anchor="middle" class="label">Dashboard</text>

  <!-- Database -->
  <rect x="600" y="600" width="140" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="625" text-anchor="middle" font-size="24">🗄️</text>
  <text x="670" y="645" text-anchor="middle" class="label">Violation Log</text>

  <!-- Partners -->
  <rect x="780" y="600" width="140" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="850" y="625" text-anchor="middle" font-size="24">🏪</text>
  <text x="850" y="645" text-anchor="middle" class="label">Partner DB</text>

  <!-- Metrics -->
  <rect x="200" y="700" width="560" height="100" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="730" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">PIPELINE METRICS</text>
  <text x="280" y="760" font-size="12" fill="#475569">• 7-Stage Airflow Pipeline</text>
  <text x="280" y="780" font-size="12" fill="#475569">• Tiered Matching System</text>
  <text x="520" y="760" font-size="12" fill="#475569">• Dual Scraping Engine</text>
  <text x="520" y="780" font-size="12" fill="#475569">• Multi-format Reports</text>
</svg>
