<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Inter', -apple-system, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .label { font-size: 12px; fill: #475569; font-weight: 500; }
    .layer-label { font-size: 10px; font-weight: 600; fill: #2563eb; text-transform: uppercase; letter-spacing: 0.08em; }
    .metric-value { font-size: 24px; font-weight: 700; fill: #2563eb; }
    .metric-label { font-size: 10px; fill: #6b7280; text-transform: uppercase; }
  </style>

  <!-- Background -->
  <rect width="960" height="850" fill="url(#bg-gradient)"/>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" class="title">Waffarha Assistant — RAG Chatbot</text>
  <text x="480" y="55" text-anchor="middle" class="subtitle">Production Architecture with Hybrid Intent Routing • 94.9% Recall • 0.62ms Latency</text>

  <!-- Layer 1: User Interface -->
  <rect x="30" y="80" width="900" height="110" rx="12" fill="#eff6ff" fill-opacity="0.4" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="50" y="100" class="layer-label">User Interface Layer</text>

  <!-- Streamlit Dashboard -->
  <rect x="50" y="115" width="140" height="55" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="145" text-anchor="middle" font-size="24">📊</text>
  <text x="120" y="165" text-anchor="middle" class="label">Streamlit UI</text>

  <!-- FastAPI Backend -->
  <rect x="220" y="115" width="140" height="55" rx="8" fill="#ffffff" stroke="#009688" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="145" text-anchor="middle" font-size="24">🚀</text>
  <text x="290" y="165" text-anchor="middle" class="label">FastAPI</text>

  <!-- User -->
  <circle cx="450" cy="142" r="30" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="450" y="148" text-anchor="middle" font-size="28">👤</text>
  <text x="450" y="185" text-anchor="middle" class="label">User Query</text>

  <!-- Arrows -->
  <path d="M 450 172 L 360 172" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="405" y="168" text-anchor="middle" font-size="9" fill="#2563eb">Query</text>

  <!-- Layer 2: RAG Engine -->
  <rect x="30" y="210" width="900" height="300" rx="12" fill="#f0fdf4" fill-opacity="0.4" stroke="#86efac" stroke-width="1.5"/>
  <text x="50" y="230" class="layer-label">RAG Engine Layer</text>

  <!-- Intent Classifier -->
  <rect x="60" y="250" width="170" height="65" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="280" text-anchor="middle" font-size="24">🎯</text>
  <text x="145" y="302" text-anchor="middle" class="label" font-weight="600">Intent Classifier</text>
  <text x="145" y="315" text-anchor="middle" font-size="9" fill="#6b7280">75% direct answers</text>

  <!-- Embedding Model -->
  <rect x="270" y="250" width="170" height="65" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="280" text-anchor="middle" font-size="24">🧠</text>
  <text x="355" y="302" text-anchor="middle" class="label" font-weight="600">Multilingual E5</text>
  <text x="355" y="315" text-anchor="middle" font-size="9" fill="#6b7280">Arabic + English</text>

  <!-- Fact Checker -->
  <rect x="480" y="250" width="170" height="65" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="565" y="280" text-anchor="middle" font-size="24">✓</text>
  <text x="565" y="302" text-anchor="middle" class="label" font-weight="600">Fact Checker</text>
  <text x="565" y="315" text-anchor="middle" font-size="9" fill="#6b7280">Hallucination prevention</text>

  <!-- Personal Data Query -->
  <rect x="690" y="250" width="170" height="65" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="280" text-anchor="middle" font-size="24">🔒</text>
  <text x="775" y="302" text-anchor="middle" class="label" font-weight="600">Personal Data</text>
  <text x="775" y="315" text-anchor="middle" font-size="9" fill="#6b7280">Direct ClickHouse</text>

  <!-- RAG Orchestrator -->
  <rect x="310" y="345" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="372" text-anchor="middle" font-size="24">⚙️</text>
  <text x="390" y="392" text-anchor="middle" class="label" font-weight="600">RAG Orchestrator</text>

  <!-- Arrows in RAG Engine -->
  <path d="M 230 282 L 270 282" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 440 282 L 480 282" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 650 282 L 690 282" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 390 315 L 390 345" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Layer 3: Vector Store -->
  <rect x="30" y="530" width="900" height="110" rx="12" fill="#faf5ff" fill-opacity="0.4" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="50" y="550" class="layer-label">Vector Storage &amp; Memory Layer</text>

  <!-- FAISS -->
  <rect x="100" y="565" width="130" height="55" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="165" y="590" text-anchor="middle" font-size="24">📚</text>
  <text x="165" y="610" text-anchor="middle" class="label">FAISS Index</text>

  <!-- ClickHouse -->
  <rect x="300" y="565" width="130" height="55" rx="8" fill="#ffffff" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="365" y="590" text-anchor="middle" font-size="24">🗄️</text>
  <text x="365" y="610" text-anchor="middle" class="label">ClickHouse</text>

  <!-- Redis -->
  <rect x="500" y="565" width="130" height="55" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="565" y="590" text-anchor="middle" font-size="24">⚡</text>
  <text x="565" y="610" text-anchor="middle" class="label">Redis Cache</text>

  <!-- Session Memory -->
  <rect x="700" y="565" width="130" height="55" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="765" y="590" text-anchor="middle" font-size="24">🧠</text>
  <text x="765" y="610" text-anchor="middle" class="label">Session Memory</text>

  <!-- Connection arrows -->
  <path d="M 390 405 L 365 530" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" stroke-dasharray="5,3"/>
  <path d="M 365 620 L 390 660" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Layer 4: LLM -->
  <rect x="30" y="680" width="900" height="110" rx="12" fill="#fff7ed" fill-opacity="0.4" stroke="#fdba74" stroke-width="1.5"/>
  <text x="50" y="700" class="layer-label">LLM Inference Layer</text>

  <!-- Ollama -->
  <rect x="200" y="715" width="180" height="55" rx="8" fill="#ffffff" stroke="#ff6b35" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="740" text-anchor="middle" font-size="24">🦙</text>
  <text x="290" y="760" text-anchor="middle" class="label">Ollama (Llama 3)</text>

  <!-- Airflow -->
  <rect x="520" y="715" width="180" height="55" rx="8" fill="#ffffff" stroke="#017cfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="610" y="740" text-anchor="middle" font-size="24">🔄</text>
  <text x="610" y="760" text-anchor="middle" class="label">Airflow (ETL)</text>

  <!-- Test Harness -->
  <rect x="750" y="715" width="150" height="55" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="825" y="740" text-anchor="middle" font-size="24">🧪</text>
  <text x="825" y="760" text-anchor="middle" class="label">Test Harness</text>

  <!-- Key Metrics Box -->
  <rect x="50" y="810" width="860" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="840" font-size="11" fill="#475569">📊 94.9% Recall</text>
  <text x="280" y="840" font-size="11" fill="#475569">⏱️ 0.62ms Latency</text>
  <text x="460" y="840" font-size="11" fill="#475569">📚 18k+ Documents</text>
  <text x="640" y="840" font-size="11" fill="#475569">🧪 110+ Test Cases</text>
  <text x="820" y="840" font-size="11" fill="#475569">✅ 96.4% Pass Rate</text>
</svg>
