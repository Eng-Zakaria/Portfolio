<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Inter', -apple-system, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #f8fafc; }
    .label { font-size: 12px; fill: #94a3b8; font-weight: 500; }
    .component { font-size: 14px; fill: #f8fafc; font-weight: 600; }
    .metric { font-size: 11px; fill: #64748b; }

    /* Animation classes */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes fly {
      0% { transform: translateX(0px); }
      100% { transform: translateX(800px); }
    }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 10 5; animation: flow 1s linear infinite; }
    .rotating { animation: rotate 3s linear infinite; }
    .blinking { animation: blink 1.5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="960" height="600" fill="url(#bg-gradient)"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" class="title">Aircraft Tracking Pipeline — Real-time ADS-B Analytics</text>

  <!-- Source: ADS-B Data -->
  <rect x="30" y="120" width="140" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="150" text-anchor="middle" font-size="28">✈️</text>
  <text x="100" y="175" text-anchor="middle" class="component">adsb.lol</text>
  <text x="100" y="195" text-anchor="middle" class="metric">Live Data Stream</text>

  <!-- Flume Agents -->
  <rect x="230" y="100" width="140" height="50" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
  <text x="300" y="125" text-anchor="middle" class="component">Flume Agent 1</text>
  <text x="300" y="145" text-anchor="middle" class="metric">HTTP Ingestion</text>

  <rect x="230" y="170" width="140" height="50" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
  <text x="300" y="195" text-anchor="middle" class="component">Flume Agent 2</text>
  <text x="300" y="215" text-anchor="middle" class="metric">Stream Processing</text>

  <!-- Kafka -->
  <rect x="430" y="120" width="140" height="80" rx="12" fill="#1e293b" stroke="#231f20" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="150" text-anchor="middle" font-size="28">📨</text>
  <text x="500" y="175" text-anchor="middle" class="component">Kafka Topic</text>
  <text x="500" y="195" text-anchor="middle" class="metric">Real-time Buffer</text>

  <!-- Spark Streaming -->
  <rect x="630" y="120" width="140" height="80" rx="12" fill="#1e293b" stroke="#ffdb00" stroke-width="2" filter="url(#glow)"/>
  <text x="700" y="150" text-anchor="middle" font-size="28">⚡</text>
  <text x="700" y="175" text-anchor="middle" class="component">Spark Streaming</text>
  <text x="700" y="195" text-anchor="middle" class="metric">Structured Processing</text>

  <!-- InfluxDB -->
  <rect x="430" y="300" width="140" height="80" rx="12" fill="#1e293b" stroke="#1976d2" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="330" text-anchor="middle" font-size="28">🗄️</text>
  <text x="500" y="355" text-anchor="middle" class="component">InfluxDB</text>
  <text x="500" y="375" text-anchor="middle" class="metric">Time-Series Storage</text>

  <!-- HDFS -->
  <rect x="630" y="300" width="140" height="80" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
  <text x="700" y="330" text-anchor="middle" font-size="28">💾</text>
  <text x="700" y="355" text-anchor="middle" class="component">HDFS</text>
  <text x="700" y="375" text-anchor="middle" class="metric">Data Archive</text>

  <!-- Grafana -->
  <rect x="430" y="480" width="140" height="80" rx="12" fill="#1e293b" stroke="#f9a825" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="510" text-anchor="middle" font-size="28">📊</text>
  <text x="500" y="535" text-anchor="middle" class="component">Grafana</text>
  <text x="500" y="555" text-anchor="middle" class="metric">Live Dashboards</text>

  <!-- Flow Arrows with Animation -->
  <!-- adsb.lol to Flume -->
  <line x1="170" y1="160" x2="230" y2="130" stroke="#059669" stroke-width="2" class="flow-line"/>
  <line x1="170" y1="180" x2="230" y2="200" stroke="#059669" stroke-width="2" class="flow-line"/>

  <!-- Flume to Kafka -->
  <line x1="370" y1="150" x2="430" y2="150" stroke="#2563eb" stroke-width="2" class="flow-line"/>

  <!-- Kafka to Spark -->
  <line x1="570" y1="160" x2="630" y2="160" stroke="#059669" stroke-width="2" class="flow-line"/>

  <!-- Spark to InfluxDB -->
  <line x1="700" y1="200" x2="500" y2="300" stroke="#ea580c" stroke-width="2" class="flow-line"/>

  <!-- Spark to HDFS -->
  <line x1="700" y1="200" x2="700" y2="300" stroke="#6b7280" stroke-width="2" class="flow-line"/>

  <!-- InfluxDB to Grafana -->
  <line x1="500" y1="380" x2="500" y2="480" stroke="#059669" stroke-width="2" class="flow-line"/>

  <!-- Animated Aircraft Icon -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="50 160" to="900 160" dur="4s" repeatCount="indefinite"/>
    <text x="0" y="0" font-size="24">✈️</text>
  </g>

  <!-- Animated Data Packets -->
  <circle cx="200" cy="150" r="4" fill="#059669" class="blinking">
    <animate attributeName="cx" from="200" to="430" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="150" r="4" fill="#2563eb" class="blinking">
    <animate attributeName="cx" from="450" to="630" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="150" r="4" fill="#ffdb00" class="blinking">
    <animate attributeName="cx" from="650" to="500" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="150" to="300" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Status Indicators -->
  <circle cx="100" cy="220" r="6" fill="#059669" class="pulse"/>
  <text x="115" y="224" class="metric">Live Stream</text>

  <circle cx="500" cy="400" r="6" fill="#2563eb" class="pulse"/>
  <text x="515" y="404" class="metric">Processing</text>

  <circle cx="500" cy="560" r="6" fill="#f9a825" class="pulse"/>
  <text x="515" y="564" class="metric">Visualization</text>

  <!-- Performance Metrics -->
  <rect x="750" y="420" width="180" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="840" y="445" text-anchor="middle" class="component">REAL-TIME METRICS</text>
  <text x="770" y="470" class="metric">✈️ Aircraft Tracked:</text>
  <text x="890" y="470" text-anchor="end" class="component" fill="#059669">10k+</text>
  <text x="770" y="495" class="metric">⏱️ Latency:</text>
  <text x="890" y="495" text-anchor="end" class="component" fill="#2563eb">&lt;1s</text>
  <text x="770" y="520" class="metric">📊 Messages/sec:</text>
  <text x="890" y="520" text-anchor="end" class="component" fill="#ea580c">1,000+</text>
  <text x="770" y="545" class="metric">🗄️ Data Stored:</text>
  <text x="890" y="545" text-anchor="end" class="component" fill="#f9a825">Real-time</text>
</svg>
