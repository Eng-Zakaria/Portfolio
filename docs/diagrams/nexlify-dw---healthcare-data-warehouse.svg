<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    text { font-family: 'Inter', -apple-system, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .label { font-size: 11px; fill: #475569; font-weight: 500; }
    .layer-label { font-size: 10px; font-weight: 600; fill: #2563eb; text-transform: uppercase; letter-spacing: 0.08em; }
  </style>

  <rect width="960" height="800" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" class="title">Healthcare Clinic Data Warehouse</text>
  <text x="480" y="55" text-anchor="middle" class="subtitle">Nexlify Client Engagement — Dimensional Modeling &amp; Star Schema</text>

  <!-- Data Sources Layer -->
  <rect x="30" y="80" width="900" height="120" rx="12" fill="#fef3c7" fill-opacity="0.5" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="50" y="100" class="layer-label">Source Systems (10+ Clinics)</text>

  <!-- Excel Files -->
  <rect x="50" y="115" width="130" height="55" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="145" text-anchor="middle" font-size="24">📊</text>
  <text x="115" y="165" text-anchor="middle" class="label">Excel Files</text>

  <!-- Clinic APIs -->
  <rect x="220" y="115" width="130" height="55" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="285" y="145" text-anchor="middle" font-size="24">🔌</text>
  <text x="285" y="165" text-anchor="middle" class="label">Clinic APIs</text>

  <!-- SQL Server -->
  <rect x="390" y="115" width="130" height="55" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="455" y="145" text-anchor="middle" font-size="24">🗄️</text>
  <text x="455" y="165" text-anchor="middle" class="label">SQL Server</text>

  <!-- MySQL -->
  <rect x="560" y="115" width="130" height="55" rx="8" fill="#ffffff" stroke="#005571" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="625" y="145" text-anchor="middle" font-size="24">🐬</text>
  <text x="625" y="165" text-anchor="middle" class="label">MySQL</text>

  <!-- SQLite -->
  <rect x="730" y="115" width="130" height="55" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="795" y="145" text-anchor="middle" font-size="24">📁</text>
  <text x="795" y="165" text-anchor="middle" class="label">SQLite</text>

  <!-- ETL Layer -->
  <rect x="30" y="220" width="900" height="140" rx="12" fill="#e0f2fe" fill-opacity="0.5" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="50" y="240" class="layer-label">ETL &amp; Data Processing</text>

  <!-- Airflow -->
  <rect x="60" y="255" width="150" height="60" rx="8" fill="#ffffff" stroke="#017cfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="280" text-anchor="middle" font-size="24">🔄</text>
  <text x="135" y="300" text-anchor="middle" class="label">Airflow</text>

  <!-- Python Scripts -->
  <rect x="250" y="255" width="150" height="60" rx="8" fill="#ffffff" stroke="#3776ab" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="280" text-anchor="middle" font-size="24">🐍</text>
  <text x="325" y="300" text-anchor="middle" class="label">Python ETL</text>

  <!-- SQL Server -->
  <rect x="440" y="255" width="150" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="515" y="280" text-anchor="middle" font-size="24">⚙️</text>
  <text x="515" y="300" text-anchor="middle" class="label">CTE &amp; JOINs</text>

  <!-- Data Quality -->
  <rect x="630" y="255" width="150" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="705" y="280" text-anchor="middle" font-size="24">✓</text>
  <text x="705" y="300" text-anchor="middle" class="label">Data Quality</text>

  <!-- Data Lake -->
  <rect x="820" y="255" width="100" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="870" y="280" text-anchor="middle" font-size="24">🏞️</text>
  <text x="870" y="300" text-anchor="middle" class="label">Raw Zone</text>

  <!-- Warehouse Layer -->
  <rect x="30" y="380" width="900" height="180" rx="12" fill="#f0fdf4" fill-opacity="0.5" stroke="#86efac" stroke-width="1.5"/>
  <text x="50" y="400" class="layer-label">Data Warehouse (PostgreSQL)</text>

  <!-- Star Schema -->
  <rect x="60" y="420" width="200" height="100" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="445" text-anchor="middle" font-size="24">⭐</text>
  <text x="160" y="465" text-anchor="middle" class="label" font-weight="600">Star Schema</text>
  <text x="160" y="480" text-anchor="middle" font-size="9" fill="#6b7280">Fact + Dimension Tables</text>
  <text x="160" y="495" text-anchor="middle" font-size="9" fill="#6b7280">SCD2 Type 2</text>

  <!-- Fact Tables -->
  <rect x="300" y="420" width="140" height="50" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="450" text-anchor="middle" font-size="16">📊</text>
  <text x="370" y="468" text-anchor="middle" class="label">Fact Tables</text>

  <!-- Dimension Tables -->
  <rect x="480" y="420" width="140" height="50" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="450" text-anchor="middle" font-size="16">📋</text>
  <text x="550" y="468" text-anchor="middle" class="label">Dimension Tables</text>

  <!-- Bridge Tables -->
  <rect x="660" y="420" width="140" height="50" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="450" text-anchor="middle" font-size="16">🔗</text>
  <text x="730" y="468" text-anchor="middle" class="label">Bridge Tables</text>

  <!-- PostgreSQL -->
  <rect x="840" y="420" width="80" height="50" rx="8" fill="#ffffff" stroke="#336791" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="880" y="450" text-anchor="middle" font-size="20">🐘</text>

  <!-- Visualization Layer -->
  <rect x="30" y="580" width="900" height="120" rx="12" fill="#fff7ed" fill-opacity="0.5" stroke="#fdba74" stroke-width="1.5"/>
  <text x="50" y="600" class="layer-label">Analytics &amp; Reporting</text>

  <!-- Power BI -->
  <rect x="60" y="620" width="150" height="60" rx="8" fill="#ffffff" stroke="#f2c811" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="645" text-anchor="middle" font-size="24">📊</text>
  <text x="135" y="665" text-anchor="middle" class="label">Power BI</text>

  <!-- Clinic Switcher -->
  <rect x="250" y="620" width="150" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="645" text-anchor="middle" font-size="24">🏥</text>
  <text x="325" y="665" text-anchor="middle" class="label">Clinic Switcher</text>

  <!-- KPIs -->
  <rect x="440" y="620" width="150" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="515" y="645" text-anchor="middle" font-size="24">📈</text>
  <text x="515" y="665" text-anchor="middle" class="label">KPI Dashboards</text>

  <!-- Metrics -->
  <rect x="630" y="620" width="150" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="705" y="645" text-anchor="middle" font-size="24">📉</text>
  <text x="705" y="665" text-anchor="middle" class="label">Revenue Tracking</text>

  <!-- Appointment Analytics -->
  <rect x="820" y="620" width="120" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="880" y="645" text-anchor="middle" font-size="24">📅</text>
  <text x="880" y="665" text-anchor="middle" class="label">Appointments</text>

  <!-- Performance Box -->
  <rect x="300" y="720" width="360" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="745" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">PERFORMANCE IMPROVEMENTS</text>
  <text x="350" y="765" font-size="12" fill="#475569">• 40% Faster Reporting</text>
  <text x="520" y="765" font-size="12" fill="#475569">• 100% Dashboard Timeouts Eliminated</text>
</svg>
