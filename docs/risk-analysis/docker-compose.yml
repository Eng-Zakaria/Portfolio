version: '3.8'

services:
  # ===========================================
  # API Service - Model Serving
  # ===========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - credit-risk-network

  # ===========================================
  # Training Service - Model Training
  # ===========================================
  training:
    build:
      context: .
      dockerfile: Dockerfile
      target: training
    container_name: credit-risk-training
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./configs:/app/configs:ro
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    networks:
      - credit-risk-network

  # ===========================================
  # MLflow - Experiment Tracking
  # ===========================================
  mlflow:
    image: python:3.11-slim
    container_name: credit-risk-mlflow
    command: >
      bash -c "pip install mlflow && 
               mlflow server 
               --backend-store-uri sqlite:///mlflow.db 
               --default-artifact-root /mlflow/artifacts 
               --host 0.0.0.0 
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - credit-risk-network

  # ===========================================
  # Dashboard - Streamlit Visualization
  # ===========================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: credit-risk-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONPATH=/app
    depends_on:
      - api
    networks:
      - credit-risk-network

  # ===========================================
  # Jupyter - Development Environment
  # ===========================================
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: credit-risk-jupyter
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    environment:
      - PYTHONPATH=/app
    networks:
      - credit-risk-network
    profiles:
      - development

  # ===========================================
  # Airflow - Workflow Orchestration
  # ===========================================
  airflow-webserver:
    image: apache/airflow:2.7.0-python3.11
    container_name: credit-risk-airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-secret-key
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./pipelines:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - airflow-data:/opt/airflow
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db init && 
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
               airflow webserver"
    networks:
      - credit-risk-network
    profiles:
      - airflow

  airflow-scheduler:
    image: apache/airflow:2.7.0-python3.11
    container_name: credit-risk-airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./pipelines:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - airflow-data:/opt/airflow
    command: airflow scheduler
    depends_on:
      - airflow-webserver
    networks:
      - credit-risk-network
    profiles:
      - airflow

networks:
  credit-risk-network:
    driver: bridge

volumes:
  mlflow-data:
  airflow-data:

