[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-gdpr-transaction-data-aggregator"
version = "1.0.0"
description = "A comprehensive pipeline for blockchain transaction analytics with GDPR/PCI compliance"
authors = [
    {name = "Blockchain Analytics Team", email = "team@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.0",
    "sqlalchemy==2.0.23",
    "alembic==1.13.0",
    "redis==5.0.1",
    "celery==5.3.4",
    "web3==6.11.3",
    "bitcoinlib==0.6.4",
    "eth-bloom==3.0.2",
    "pandas==2.1.4",
    "numpy==1.25.2",
    "scipy==1.11.4",
    "scikit-learn==1.3.2",
    "psycopg2-binary==2.9.9",
    "elasticsearch==8.11.0",
    "pymongo==4.6.0",
    "requests==2.31.0",
    "aiohttp==3.9.1",
    "ccxt==4.1.64",
    "cryptography==41.0.8",
    "pycryptodome==3.19.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "structlog==23.2.0",
    "prometheus-client==0.19.0",
    "sentry-sdk==1.38.0",
    "networkx==3.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "httpx==0.25.2",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "pre-commit==3.6.0",
]

[project.urls]
Homepage = "https://github.com/example/blockchain-gdpr-transaction-data-aggregator"
Repository = "https://github.com/example/blockchain-gdpr-transaction-data-aggregator.git"
Documentation = "https://blockchain-gdpr-transaction-data-aggregator.readthedocs.io/"
"Bug Tracker" = "https://github.com/example/blockchain-gdpr-transaction-data-aggregator/issues"

[project.scripts]
blockchain-gdpr-transaction-data-aggregator = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "web3.*",
    "bitcoinlib.*",
    "ccxt.*",
    "networkx.*",
    "redis.*",
    "celery.*",
    "elasticsearch.*",
    "pymongo.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    ".tox",
]

[tool.alembic]
script_location = "migrations"
prepend_sys_path = "."
version_path_separator = "os"
sqlalchemy.url = "postgresql://user:password@localhost:5432/blockchain_analytics"

[tool.alembic.post_write_hooks]
hooks = "black"
black.type = "console_scripts"
black.entrypoint = "black"
black.options = "-l 88 REVISION_SCRIPT_FILENAME"
